<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>受講生詳細</title>
</head>
<style>
  body { font-family: sans-serif; background: #f5f5f0; margin: 0; padding: 2rem; }
      .form-card {
        background: #fff; border: 1px solid #e0dfd8;
        border-radius: 12px; padding: 1.5rem;
        max-width: 560px; margin: 0 auto;
      }
      .form-header {
        display: flex; align-items: center; gap: 10px;
        margin-bottom: 1.5rem; padding-bottom: 1rem;
        border-bottom: 1px solid #e0dfd8;
      }
      .form-header h1 { font-size: 18px; font-weight: 500; margin: 0; }
      .section-title {
        font-size: 12px; font-weight: 500; color: #888;
        text-transform: uppercase; letter-spacing: 0.04em;
        margin: 0 0 0.75rem; padding-bottom: 6px;
        border-bottom: 1px solid #e0dfd8;
      }
      .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
      .field label { font-size: 13px; color: #666; }
      .field input, .field select, .field textarea {
        font-size: 14px; padding: 8px 10px;
        border: 1px solid #d0cfc8; border-radius: 8px;
        background: #fff; color: #1a1a18;
      }
      .field textarea { resize: vertical; }
      .required { color: #c0392b; }
      .btn-row {
        display: flex; justify-content: flex-end; gap: 8px;
        margin-top: 1.25rem; padding-top: 1rem;
        border-top: 1px solid #e0dfd8;
      }
      .btn-submit, .btn-cancel {
        padding: 8px 20px; font-size: 14px;
        border-radius: 8px; cursor: pointer;
      }
      .btn-submit { background: #fff; border: 1px solid #aaa; color: #1a1a18; }
      .btn-cancel { background: transparent; border: 1px solid #ddd; color: #666; }
      .btn-submit:hover { background: #f0efe8; }
</style>
</head>
<body>
<div class="form-card">
  <div class="form-header">
    <h1>受講生詳細</h1>
    <span style="font-size: 12px; color: #c0392b; margin-left: auto; align-self: flex-end;">* は必須です</span>
  </div>

  <form th:action="@{/updateStudent}" th:object="${studentDetail}" method="post"
        onkeydown="return event.key !=='Enter';">
    <div th:if="${#fields.hasErrors('*')}" style="color: red;">
      <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
    </div>

    <input type="hidden" th:field="*{student.id}"/>
    <input type="hidden" th:field="*{studentsCourses[0].id}"/>

    <p class="section-title">基本情報</p>
    <div class="field-row">
      <div class="field">
        <label>名前 <span class="required">*</span></label>
        <input type="text" th:field="*{student.fullName}" placeholder="山田 太郎"/>
      </div>
      <div class="field">
        <label>フリガナ<span class="required">*</span></label>
        <input type="text" th:field="*{student.furigana}" placeholder="ヤマダ タロウ"/>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>ニックネーム<span class="required">*</span></label>
        <input type="text" th:field="*{student.nickname}" placeholder="たろう"/>
      </div>
      <div class="field">
        <label>年齢</label>
        <input type="number" th:field="*{student.age}" placeholder="25"/>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>メールアドレス <span class="required">*</span></label>
        <input type="email" th:field="*{student.email}" placeholder="taro@example.com"/>
      </div>
      <div class="field">
        <label>居住地<span class="required">*</span></label>
        <input type="text" th:field="*{student.city}" placeholder="東京都"/>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>性別</label>
        <select th:field="*{student.gender}">
          <option value="">選択してください</option>
          <option value="男性">男性</option>
          <option value="女性">女性</option>
          <option value="その他">その他</option>
        </select>
      </div>
    </div>

    <div class="field" style="flex-direction: row; align-items: center; gap: 8px;">
      <input type="checkbox" id="isDeleted" th:field="*{student.deleted}" style="width: auto;"/>
      <label for="isDeleted" style="margin: 0;">退会（削除）にする</label>
    </div>

    <p class="section-title" style="margin-top: 1rem;">受講コース</p>
    <div class="field-row" th:each="course, iterStat : *{studentsCourses}">
      <input type="hidden" th:field="*{studentsCourses[__${iterStat.index}__].id}"/>
      <div class="field">
        <label th:text="'コース名 ' + (${iterStat.index} == 0 ? '(必須)' : '(空欄で送信すると無視されます)')"></label>
        <input type="text" th:field="*{studentsCourses[__${iterStat.index}__].course}" placeholder="Javaコース"/>
      </div>
      <div class="field">
        <label>開始日</label>
        <input type="date" th:field="*{studentsCourses[__${iterStat.index}__].startDate}" readonly/>
      </div>
      <div class="field">
        <label>終了予定日</label>
        <input type="date" th:field="*{studentsCourses[__${iterStat.index}__].expectedEndDate}"/>
      </div>
    </div>

    <p class="section-title" style="margin-top: 1rem;">備考</p>
    <div class="field">
      <label>メモ</label>
      <textarea th:field="*{student.remark}" rows="3"
                placeholder="特記事項があれば入力してください"></textarea>
    </div>

    <div class="btn-row">
      <a href="/studentList" class="btn-cancel">キャンセル</a>
      <button type="submit" class="btn-submit">更新する →</button>
    </div>

  </form>
</div>
</body>
</html>
